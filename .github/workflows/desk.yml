name: desk-cycle
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: desk, cancel-in-progress: false}
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: python scripts/scrape.py
      - run: npm ci && npm test
        working-directory: bot
      - name: cycle
        working-directory: bot
        env:
          MODE: ${{ vars.MODE }}
          KILL: ${{ vars.KILL }}
          RPC_URL: ${{ secrets.RPC_URL }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
        run: node run.js
      - run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git add data bot/state.json
          git diff --cached --quiet || (git commit -qm "desk cycle $(date -u +%FT%TZ)" && git pull -q --rebase && git push -q)
