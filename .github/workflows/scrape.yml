name: scrape-telegram
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scrape, cancel-in-progress: false}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/scrape.py
      - run: |
          git config user.name "desk-terminal-bot"
          git config user.email "desk-terminal-bot@users.noreply.github.com"
          git add data/calls.json
          git diff --cached --quiet || (git commit -m "Update calls $(date -u +%FT%TZ)" && git push)
